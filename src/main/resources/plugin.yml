name: SSGCreateOnMinecraft
version: 1.0.0
main: dev.createonmc.CreateOnMinecraftPlugin
api-version: "26.1.2"
description: Recreating the Create mod as a Paper plugin
author: Demarky
depend: [Nexo]

commands:
  ssggive:
    description: Give a Create item
    usage: /ssggive <gear|biggear|eixo|motor [rpm]|water_wheel>
    permission: createonmc.ssggive
  gearstress:
    description: Multiply gear placements in a line for performance testing
    usage: /gearstress <n>
  ssgitem:
    description: Give a preview display item for texture testing
    usage: /ssgitem <model_id>
  ssgclear:
    description: Remove all Create entities and barriers in a world
    usage: /ssgclear [world]
